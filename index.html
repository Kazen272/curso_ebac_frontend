<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="shortcut icon" href="./img/tarefa.png" type="image/x-icon">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- CSS Nativo -->
    <link rel="stylesheet" href="./css/style.css">



</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="text-center">Lista de Tarefas</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <form id="formTarefa">
                    <div class="form-group">
                        <label for="tarefa"> <B>Tarefa</B></label>
                        <input type="text" class="form-control" id="tarefa" name="tarefa" placeholder="Digite a tarefa">
                    </div>
                    <div id="Cadastrar-tarefa" class="text-end">
                        <button type="submit" class="btn btn-primary">Adicionar</button>
                    </div>
                </form>
            </div>
            <div>
                <ul>
                    <div class="list-group" id="listaTarefas">
                        <!-- As tarefas serão adicionadas aqui dinamicamente -->
            </ul>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
